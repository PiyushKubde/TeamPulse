# Local infrastructure for WorkPulse. Matches the defaults in .env.example.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workpulse
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data', './scripts/init-test-dbs.sql:/docker-entrypoint-initdb.d/init.sql:ro']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  # Optional: S3-compatible storage for evidence files (set S3_BUCKET=workpulse, S3_ENDPOINT=http://localhost:9000).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']
  # Optional: catches outgoing email locally (set SMTP_HOST=localhost, SMTP_PORT=1025); UI at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['1025:1025', '8025:8025']
volumes:
  pgdata:
  miniodata:
