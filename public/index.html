<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TeamPulse</title>
  <meta name="description" content="TeamPulse — work intelligence that makes contributions visible. Work volume is not work value.">
  <meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)">
  <script>
    // Theme before first paint, so the page never flashes the wrong theme. Light is the default; 'system' follows the OS live.
    (function () {
      var pref = 'light'
      try { pref = localStorage.getItem('tp-theme') || 'light' } catch (e) {}
      var mq = window.matchMedia('(prefers-color-scheme: dark)')
      function apply() {
        var p = document.documentElement.dataset.themePref || pref
        document.documentElement.dataset.theme = p === 'dark' || (p === 'system' && mq.matches) ? 'dark' : 'light'
      }
      document.documentElement.dataset.themePref = pref
      apply()
      mq.addEventListener ? mq.addEventListener('change', apply) : mq.addListener(apply)
    })()
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111111'/%3E%3Cpath d='M6 17h5l3-7 4 13 3-6h5' fill='none' stroke='%23C6F36A' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>

</body>
</html>
