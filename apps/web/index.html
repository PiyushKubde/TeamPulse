<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KONVO — AI Work Intelligence Platform</title>
    <meta
      name="description"
      content="KONVO turns conversations into tasks with the right owner, connects goals and evidence, and shows each person's impact with reasons you can check. From conversations to contribution."
    />
    <meta name="application-name" content="KONVO" />
    <meta name="apple-mobile-web-app-title" content="KONVO" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KONVO" />
    <meta property="og:title" content="KONVO — AI Work Intelligence Platform" />
    <meta property="og:description" content="From conversations to contribution. Work moves forward. Every contribution counts." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="KONVO: Work moves forward. Every contribution counts." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KONVO — AI Work Intelligence Platform" />
    <meta name="twitter:description" content="From conversations to contribution. Work moves forward. Every contribution counts." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="theme-color" content="#1B2430" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Theme before first paint, so the page never flashes the wrong theme. Dark is the default.
      ;(function () {
        var pref = 'dark'
        try {
          pref = localStorage.getItem('konvo-theme') || 'dark'
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#1B2430' : '#EEF1F5')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
